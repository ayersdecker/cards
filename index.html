    <script>
      (function () {
        var search = window.location.search;
        if (search.indexOf('?p=') === 0) {
          var route = decodeURIComponent(search.slice(3));
          var cleanRoute = route || '/';
          var nextUrl = cleanRoute + window.location.hash;
          window.history.replaceState(null, '', nextUrl);
          return;
        }

        if (window.location.hash && window.location.hash.indexOf('#/') === 0) {
          var hashRoute = window.location.hash.slice(1);
          window.history.replaceState(null, '', hashRoute);
        }
      })();
    </script>
